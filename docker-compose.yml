x-gcs-creds: &gcs-creds
  GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/backup-sa.json

services:
  api:
    build: ./server
    container_name: rumihome-api
    restart: unless-stopped
    environment:
      FIREBASE_PROJECT_ID: rumihome-448217
      DB_PATH: /data/rumihome.db
    volumes:
      - rumihome_data:/data
    networks:
      - rumihome

  # Respaldo continuo: replica el SQLite a GCS cada 10s
  litestream:
    image: litestream/litestream:0.3.13
    container_name: rumihome-litestream
    restart: unless-stopped
    command: replicate -config /etc/litestream.yml
    environment:
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/gcs-creds.json
    volumes:
      - ./litestream.yml:/etc/litestream.yml:ro
      - /root/backup-sa.json:/run/secrets/gcs-creds.json:ro
      - rumihome_data:/data
    depends_on:
      - api
    networks:
      - rumihome

  app:
    build:
      context: ./app
      args:
        VITE_ADMIN_PATH: /admin
        VITE_GUEST_PATH: /reserva
        VITE_FIREBASE_API_KEY: AIzaSyCpuL_aoKkogaWtkhPKsnWRw68FP5J5ecg
        VITE_FIREBASE_AUTH_DOMAIN: rumihome-448217.firebaseapp.com
        VITE_FIREBASE_PROJECT_ID: rumihome-448217
        VITE_FIREBASE_APP_ID: 1:315822949726:web:7e0d2556d560e170917bcf
    container_name: rumihome-app
    restart: unless-stopped
    depends_on:
      - api
    networks:
      - rumihome

  # Agente IA: Telegram + LangChain + Ollama Cloud (glm-5.3-flash)
  agent:
    build: ./agent
    container_name: rumihome-agent
    restart: unless-stopped
    env_file: /root/agent.env
    environment:
      OLLAMA_API_KEY: ${OLLAMA_API_KEY}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID}
      FIREBASE_EMAIL: ${FIREBASE_EMAIL}
      FIREBASE_PASSWORD: ${FIREBASE_PASSWORD}
    depends_on:
      - api
    networks:
      - rumihome

networks:
  rumihome:
    name: rumihome

volumes:
  rumihome_data:
    name: rumihome_data