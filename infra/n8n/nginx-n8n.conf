# n8n.rumihome.io — editor con auth de n8n, webhooks públicos (cada workflow valida su token)
server {
    listen 80;
    server_name n8n.rumihome.io;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    server_name n8n.rumihome.io;

    ssl_certificate     /etc/letsencrypt/live/rumihome.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rumihome.io/privkey.pem;

    # Webhooks: públicos, sin auth de editor (los workflows validan token/secret propios)
    location /webhook/ {
        proxy_pass http://127.0.0.1:5678;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Editor + resto: protegido por user management de n8n (owner = Daniel)
    location / {
        proxy_pass http://127.0.0.1:5678;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}